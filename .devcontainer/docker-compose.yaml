services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3-3.13
    volumes:
      - ..:/workspaces/mqtt-resampler:cached
      - claude-config:/home/vscode/.claude
      - ${HOME}/.ssh/tgruenert-github-private-repos:/run/deploy_key:ro      
    command: sleep infinity
    environment:
      CONFIG_FILE: /workspaces/mqtt-resampler/.devcontainer/config.yaml
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      GIT_SSH_COMMAND: ssh -i /home/vscode/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"

volumes:
  claude-config: